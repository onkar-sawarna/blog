<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t">
  <title id="t">ICMP can succeed while TCP to the app port hangs</title>
  <rect width="720" height="260" fill="#F7F7F5"/>
  <rect x="28" y="86" width="120" height="72" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="88" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#161616">you</text>
  <rect x="572" y="86" width="120" height="72" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="632" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#161616">host</text>
  <line x1="158" y1="104" x2="562" y2="104" stroke="#1A3D32" stroke-width="2"/>
  <polygon points="562,104 548,98 548,110" fill="#1A3D32"/>
  <text x="360" y="92" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1A3D32">ICMP echo  ·  ok</text>
  <line x1="158" y1="148" x2="400" y2="148" stroke="#B33A1A" stroke-width="2"/>
  <rect x="400" y="128" width="14" height="40" fill="#B33A1A"/>
  <text x="300" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">TCP :443  ·  hang</text>
  <text x="360" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Same IP. Two paths. Ping answered the wrong question.</text>
</svg>
