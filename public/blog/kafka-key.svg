<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>Same user key always drops into the same lane. A later event for that user follows.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="28" y="88" width="88" height="72" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="72" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">API</text>
  <text x="72" y="142" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">publish</text>

  <path d="M116 124 H168" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M160 118 L170 124 L160 130" fill="none" stroke="#1A3D32" stroke-width="1.6"/>

  <path d="M170 88 L246 88 L278 124 L246 160 L170 160 Z" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="214" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">hash</text>
  <text x="214" y="142" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">% 3</text>

  <path d="M278 108 L348 62" stroke="#1A3D32" stroke-width="1.4"/>
  <path d="M278 124 L348 124" stroke="#1A3D32" stroke-width="1.4"/>
  <path d="M278 140 L348 186" stroke="#1A3D32" stroke-width="1.4"/>

  <rect x="348" y="36" width="344" height="44" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.8"/>
  <rect x="364" y="46" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.2"/>
  <text x="386" y="63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">u1</text>
  <rect x="416" y="46" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.2"/>
  <text x="438" y="63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">u3</text>
  <rect x="468" y="46" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.2"/>
  <text x="490" y="63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">u1</text>
  <text x="668" y="64" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">lane 0</text>

  <rect x="348" y="102" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="520" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">nobody landed here</text>

  <rect x="348" y="168" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.8"/>
  <rect x="364" y="178" width="44" height="24" rx="3" fill="#F7F7F5" stroke="#1A3D32" stroke-width="1.2"/>
  <text x="386" y="195" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">u2</text>
  <rect x="416" y="178" width="44" height="24" rx="3" fill="#F7F7F5" stroke="#1A3D32" stroke-width="1.2"/>
  <text x="438" y="195" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">u4</text>
  <text x="668" y="196" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">lane 2</text>

  <text x="360" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">u1 goes to lane 0. Later u1 goes to lane 0 again.</text>
  <text x="360" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C5C59">That is the only order Kafka promised you.</text>
</svg>
