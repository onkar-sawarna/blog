<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img">
  <title>A buyer hits checkout. The API writes order o1, publishes an event, and returns 200. It does not call search or the counter.</title>
  <rect width="720" height="280" fill="#F7F7F5"/>

  <rect x="24" y="88" width="80" height="48" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="64" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">buyer</text>
  <path d="M104 112 H140" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M132 106 L142 112 L132 118" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="122" y="100" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5C5C59">checkout</text>

  <rect x="148" y="80" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="198" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">API</text>
  <text x="198" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">returns 200</text>

  <path d="M198 80 V56" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M192 64 L198 54 L204 64" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <rect x="148" y="16" width="100" height="40" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="198" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">row o1</text>

  <path d="M248 112 H300" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M292 106 L302 112 L292 118" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="274" y="100" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5C5C59">publish</text>

  <rect x="308" y="84" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="368" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">event o1</text>

  <rect x="468" y="36" width="228" height="72" rx="6" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="582" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">search</text>
  <text x="582" y="90" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">API does not call this</text>

  <rect x="468" y="128" width="228" height="72" rx="6" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="582" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">counter</text>
  <text x="582" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">API does not call this</text>

  <text x="360" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">The row is the fact. The event is the news.</text>
  <text x="360" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">Checkout is done. Search and count are later jobs.</text>
</svg>
