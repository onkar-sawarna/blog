<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img">
  <title>It is easier to sound sure in your head than in a sentence.</title>
  <rect width="720" height="220" fill="#F7F7F5"/>
  <rect x="36" y="36" width="300" height="112" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="186" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#B33A1A">in my head</text>
  <text x="186" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">I already know this</text>
  <rect x="384" y="36" width="300" height="112" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="534" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1A3D32">in a sentence</text>
  <text x="534" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">where does it actually start</text>
  <text x="360" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Prose is where the gap stops hiding.</text>
</svg>
