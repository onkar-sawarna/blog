<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img">
<style>
@media (prefers-reduced-motion: reduce) {
  animate, animateMotion, animateTransform { display: none !important; }
  [opacity="0"] { opacity: 1 !important; }
}
</style>
  <title>The player polls the live playlist. New segment lines are appended. There is no ENDLIST.</title>
  <rect width="720" height="320" fill="#F7F7F5"/>

  <rect x="16" y="56" width="100" height="52" rx="6" fill="#FFFFFF" stroke="#161616" stroke-width="1.6"/>
  <text x="66" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">player</text>

  <g>
    <animate attributeName="opacity" values="0.35;1;0.35;1;0.35" keyTimes="0;0.15;0.35;0.55;1" dur="7s" repeatCount="indefinite"/>
    <path d="M116 82 H168" stroke="#B33A1A" stroke-width="1.6"/>
    <path d="M160 76 L170 82 L160 88" fill="none" stroke="#B33A1A" stroke-width="1.6"/>
    <text x="142" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">poll</text>
  </g>

  <rect x="172" y="20" width="248" height="200" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="296" y="48" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">720p.m3u8</text>
  <text x="296" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">#EXTINF:6.000,</text>
  <text x="296" y="92" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">seg399.ts</text>
  <text x="296" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">#EXTINF:6.000,</text>
  <text x="296" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">seg400.ts</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.4;1" dur="7s" repeatCount="indefinite"/>
    <text x="296" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">#EXTINF:6.000,</text>
    <text x="296" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">seg401.ts</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.62;0.74;1" dur="7s" repeatCount="indefinite"/>
    <text x="296" y="192" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">#EXTINF:6.000,</text>
    <text x="296" y="208" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">seg402.ts</text>
  </g>

  <path d="M420 120 H468" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M460 114 L470 120 L460 126" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="472" y="56" width="232" height="128" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="588" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">origin</text>
  <text x="588" y="116" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">GET seg401.ts</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.62;0.74;0.86;1" dur="7s" repeatCount="indefinite"/>
    <text x="588" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">GET seg402.ts</text>
    <text x="588" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#B33A1A">decode, draw</text>
  </g>

  <text x="360" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Live is the same GET, again. New lines show up.</text>
  <text x="360" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">The player never sees a last line, so it cannot know the length.</text>
</svg>
