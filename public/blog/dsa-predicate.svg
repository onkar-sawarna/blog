  <text x="84" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#B33A1A">no</text>
  <rect x="132" y="48" width="72" height="56" rx="4" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.5"/>
  <text x="168" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#B33A1A">no</text>
  <rect x="216" y="48" width="72" height="56" rx="4" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.5"/>
  <text x="252" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#B33A1A">no</text>
  <rect x="300" y="48" width="72" height="56" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="336" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1A3D32">yes</text>
  <rect x="384" y="48" width="72" height="56" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="420" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1A3D32">yes</text>
  <rect x="468" y="48" width="72" height="56" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="504" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1A3D32">yes</text>
  <rect x="552" y="48" width="72" height="56" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="588" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1A3D32">yes</text>
