<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img">
  <title>Kinds of locking on seat 12A: shared vs exclusive, pessimistic vs optimistic, row lock vs remote key.</title>
  <rect width="720" height="320" fill="#F7F7F5"/>
  <rect x="16" y="16" width="224" height="120" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="128" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">shared</text>
  <text x="128" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">two desks read 12A</text>
  <text x="128" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">FOR SHARE</text>
  <rect x="248" y="16" width="224" height="120" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="360" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">exclusive</text>
  <text x="360" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">one desk books 12A</text>
  <text x="360" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">FOR UPDATE</text>
  <rect x="480" y="16" width="224" height="120" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="592" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">optimistic</text>
  <text x="592" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">no wait list</text>
  <text x="592" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">version on the row</text>
  <rect x="16" y="152" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="128" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">row lock</text>
  <text x="128" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">lock manager, primary</text>
  <text x="128" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">same as the write</text>
  <rect x="248" y="152" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="360" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">remote lock</text>
  <text x="360" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">key in Redis</text>
  <text x="360" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">not the seat row</text>
  <rect x="480" y="152" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="592" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">distributed</text>
  <text x="592" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">two API boxes</text>
  <text x="592" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">one key they both see</text>
  <text x="360" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Who waits, where the lock lives, what decides the seat.</text>
</svg>
