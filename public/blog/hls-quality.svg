<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
<style>
@media (prefers-reduced-motion: reduce) {
  animate, animateMotion, animateTransform { display: none !important; }
  [opacity="0"] { opacity: 1 !important; }
}
</style>
  <title>A quality switch fetches 360p.m3u8 and the matching segment. The master menu stays the same.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="16" y="20" width="152" height="88" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="92" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">master.m3u8</text>
  <text x="92" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">360p</text>
  <text x="92" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">720p</text>

  <rect x="200" y="20" width="88" height="52" rx="6" fill="#FFFFFF" stroke="#161616" stroke-width="1.6"/>
  <text x="244" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">player</text>

  <g>
    <animate attributeName="opacity" values="1;1;0.3;0.3" keyTimes="0;0.35;0.5;1" dur="6s" repeatCount="indefinite"/>
    <path d="M288 46 H336" stroke="#5C5C59" stroke-width="1.5"/>
    <path d="M328 40 L338 46 L328 52" fill="none" stroke="#5C5C59" stroke-width="1.5"/>
    <rect x="340" y="16" width="172" height="88" rx="8" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.6"/>
    <text x="426" y="44" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">720p.m3u8</text>
    <text x="426" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">seg180.ts</text>
    <text x="426" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">leaving this list</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.55;1" dur="6s" repeatCount="indefinite"/>
    <path d="M244 72 V140 H336" stroke="#B33A1A" stroke-width="1.6"/>
    <path d="M328 134 L338 140 L328 146" fill="none" stroke="#B33A1A" stroke-width="1.6"/>
    <rect x="340" y="120" width="172" height="88" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
    <text x="426" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">360p.m3u8</text>
    <text x="426" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">seg180.ts</text>
    <text x="426" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#B33A1A">same 18:00</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.55;0.65;0.8;1" dur="6s" repeatCount="indefinite"/>
    <path d="M512 164 H560" stroke="#1A3D32" stroke-width="1.5"/>
    <path d="M552 158 L562 164 L552 170" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
    <rect x="564" y="136" width="140" height="56" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
    <text x="634" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">GET 360p/</text>
    <text x="634" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">seg180.ts</text>
  </g>

  <text x="360" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">The master is unchanged. A different child list comes in.</text>
  <text x="360" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">Resume from the matching chunk, not from the start.</text>
</svg>
