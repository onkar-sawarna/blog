<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>Many client connections into ProxySQL share a smaller set of connections to MySQL. One backend socket carries one query at a time.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="20" y="28" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="120" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">API clients</text>
  <text x="120" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">c1 GET 42</text>
  <text x="120" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">c2 GET 42</text>
  <text x="120" y="136" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">c3 GET 87</text>
  <text x="120" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">c4 idle</text>
  <text x="120" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C5C59">hundreds of sessions</text>

  <path d="M220 128 H268" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M260 122 L270 128 L260 134" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="272" y="28" width="176" height="200" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="360" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">ProxySQL</text>
  <text x="360" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">reads the query</text>
  <text x="360" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">picks a free</text>
  <text x="360" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">backend socket</text>
  <text x="360" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">multiplex</text>

  <path d="M448 128 H496" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M488 122 L498 128 L488 134" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="500" y="48" width="200" height="160" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">MySQL</text>
  <rect x="520" y="100" width="160" height="32" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="600" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">b1 busy, 42</text>
  <rect x="520" y="140" width="160" height="32" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="600" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">b2 busy, 87</text>
  <text x="600" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">40 live sockets</text>

  <text x="360" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Idle client sessions do not each own a MySQL socket.</text>
</svg>
