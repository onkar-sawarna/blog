<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>Happy Eyeballs starts IPv6, then IPv4, and keeps the first socket that connects.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>
  <rect x="40" y="36" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="140" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#B33A1A">try IPv6</text>
  <text x="140" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">first</text>
  <text x="140" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">SYN</text>
  <text x="140" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">silence</text>
  <rect x="260" y="36" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1A3D32">try IPv4</text>
  <text x="360" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">after a short wait</text>
  <text x="360" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">SYN</text>
  <text x="360" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1A3D32">connects</text>
  <rect x="480" y="36" width="200" height="200" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="580" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1A3D32">keep the winner</text>
  <text x="580" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">drop the other</text>
  <text x="580" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">Happy Eyeballs</text>
  <text x="360" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">A race, not one SYN until it dies.</text>
</svg>
