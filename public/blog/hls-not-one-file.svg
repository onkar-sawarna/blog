<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>A player does not fetch one talk file. It fetches a master menu, a playlist, then short segments.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="16" y="20" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="116" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">the model I had</text>
  <rect x="40" y="72" width="152" height="44" rx="6" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/>
  <text x="116" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">player</text>
  <path d="M116 116 V140" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M110 132 L116 142 L122 132" fill="none" stroke="#B33A1A" stroke-width="1.5"/>
  <rect x="36" y="144" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="116" y="166" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">talk.mp4</text>
  <text x="116" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#B33A1A">one file</text>
  <line x1="48" y1="156" x2="184" y2="180" stroke="#B33A1A" stroke-width="1.6"/>

  <rect x="236" y="20" width="468" height="200" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="470" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">what the player fetches</text>

  <rect x="256" y="72" width="88" height="44" rx="6" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/>
  <text x="300" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">player</text>

  <path d="M344 94 H384" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M376 88 L386 94 L376 100" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="388" y="64" width="132" height="60" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="454" y="90" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">master.m3u8</text>
  <text x="454" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">360p, 720p</text>

  <path d="M520 94 H560" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M552 88 L562 94 L552 100" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="564" y="64" width="120" height="60" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="624" y="90" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">720p.m3u8</text>
  <text x="624" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">400 lines</text>

  <path d="M624 124 V148" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M618 140 L624 150 L630 140" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="388" y="152" width="296" height="52" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="536" y="174" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">seg0.ts   seg1.ts   seg2.ts</text>
  <text x="536" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">six seconds each</text>

  <text x="360" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Talk 7 is a menu, a list, and a pile of short files.</text>
  <text x="360" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">The master does not change. The recording playlist already has an end.</text>
</svg>
