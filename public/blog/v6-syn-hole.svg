<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img">
  <title>IPv6 SYN goes into a hole. IPv4 SYN gets SYN-ACK.</title>
  <rect width="720" height="280" fill="#F7F7F5"/>
  <rect x="24" y="40" width="200" height="88" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="124" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#B33A1A">SYN to IPv6</text>
  <text x="124" y="104" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">no SYN-ACK</text>
  <path d="M224 84 H300" stroke="#B33A1A" stroke-width="1.6"/>
  <rect x="304" y="40" width="160" height="88" rx="8" fill="#F8EFE9" stroke="#B33A1A" stroke-width="2"/>
  <text x="384" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#B33A1A">hole</text>
  <text x="384" y="104" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">packet dies</text>
  <rect x="24" y="156" width="200" height="88" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="124" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1A3D32">SYN to IPv4</text>
  <text x="124" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">later, or in a race</text>
  <path d="M224 200 H300" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M290 194 L302 200 L290 206" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <rect x="304" y="156" width="160" height="88" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="384" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1A3D32">API</text>
  <text x="384" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">SYN-ACK</text>
  <rect x="500" y="88" width="196" height="108" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="598" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">same shop</text>
  <text x="598" y="164" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">two addresses</text>
</svg>
