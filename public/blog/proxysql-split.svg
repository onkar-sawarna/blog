<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>A monolith splits into a catalog service and a checkout service. Both still connect to one MySQL-looking host, which is ProxySQL.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="20" y="36" width="140" height="72" rx="6" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="90" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">monolith</text>
  <text x="90" y="90" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">one process</text>

  <path d="M160 72 H200" stroke="#1A3D32" stroke-width="1.4"/>
  <path d="M192 66 L202 72 L192 78" fill="none" stroke="#1A3D32" stroke-width="1.4"/>

  <rect x="204" y="20" width="148" height="56" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="278" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">catalog</text>
  <text x="278" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">GET item 42</text>

  <rect x="204" y="88" width="148" height="56" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="278" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">checkout</text>
  <text x="278" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">Buy, order o1</text>

  <path d="M352 48 H400" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M392 42 L402 48 L392 54" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M352 116 H400" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M392 110 L402 116 L392 122" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="404" y="40" width="140" height="96" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="474" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">ProxySQL</text>
  <text x="474" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">looks like MySQL</text>

  <path d="M544 88 H584" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M576 82 L586 88 L576 94" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="588" y="48" width="112" height="80" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="644" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">MySQL</text>
  <text x="644" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">one cluster</text>

  <text x="360" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">The split is in the API. The database map is not.</text>
  <text x="360" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">Neither service ships with primary and replica hostnames.</text>
  <text x="360" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">They both got a MySQL host. It was the proxy.</text>
</svg>
