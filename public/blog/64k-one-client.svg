<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t1">
  <title id="t1">One client to one service: only the source port changes</title>
  <rect width="720" height="280" fill="#F7F7F5"/>
  <rect x="36" y="80" width="150" height="88" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="111" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#161616">m1</text>
  <text x="111" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">one source IP</text>
  <rect x="534" y="80" width="150" height="88" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="609" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#161616">m2</text>
  <text x="609" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">:443 only</text>
  <line x1="196" y1="110" x2="524" y2="110" stroke="#1A3D32" stroke-width="1.5"/>
  <line x1="196" y1="124" x2="524" y2="124" stroke="#1A3D32" stroke-width="1.5"/>
  <line x1="196" y1="138" x2="524" y2="138" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="360" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">source ports ~64k, then full</text>
  <text x="360" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Fixed: src IP, dst IP, dst port</text>
  <text x="360" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C5C59">Free: src port (16 bits)</text>
</svg>
