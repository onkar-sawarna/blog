<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t">
  <title id="t">Logs, metrics, and traces answer different questions. Context cuts all three.</title>
  <rect width="720" height="220" fill="#F7F7F5"/>
  <rect x="24" y="36" width="160" height="100" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="104" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#161616">logs</text>
  <text x="104" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">one process, once</text>
  <rect x="196" y="36" width="160" height="100" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="276" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#161616">metrics</text>
  <text x="276" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">shape over time</text>
  <rect x="368" y="36" width="160" height="100" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="448" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#161616">traces</text>
  <text x="448" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">which hop ate time</text>
  <rect x="540" y="36" width="160" height="100" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="620" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#161616">context</text>
  <text x="620" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">host, service, tenant</text>
  <text x="360" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Pick the signal that can answer the question. Context is how you cut.</text>
</svg>
