<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img">
  <title>Passenger A and passenger B both tap Book on seat 12A. Two API requests hit the same row.</title>
  <rect width="720" height="260" fill="#F7F7F5"/>
  <rect x="24" y="48" width="140" height="72" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="94" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">A taps Book</text>
  <text x="94" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">seat 12A</text>
  <rect x="24" y="140" width="140" height="72" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="94" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">B taps Book</text>
  <text x="94" y="194" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">seat 12A</text>
  <path d="M164 84 H220" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M212 78 L222 84 L212 90" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M164 176 H220" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M212 170 L222 176 L212 182" fill="none" stroke="#B33A1A" stroke-width="1.5"/>
  <rect x="224" y="88" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="304" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">API</text>
  <text x="304" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">two requests</text>
  <path d="M384 128 H440" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M432 122 L442 128 L432 134" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <rect x="444" y="80" width="252" height="96" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="570" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1A3D32">seats row 12A</text>
  <text x="570" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">empty, for a moment</text>
  <text x="360" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">One seat. Two clicks. The lock is the argument.</text>
</svg>
