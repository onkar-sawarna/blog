<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img">
  <title>An SNS filter drops o1 from the count queue. Search still gets a copy. The dashboard stays 0.</title>
  <rect width="720" height="260" fill="#F7F7F5"/>

  <rect x="24" y="72" width="72" height="40" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="60" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">API</text>
  <path d="M96 92 H132" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M124 86 L134 92 L124 98" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="136" y="72" width="88" height="40" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="180" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">SNS</text>
  <path d="M224 92 H256" stroke="#1A3D32" stroke-width="1.5"/>
  <rect x="256" y="56" width="100" height="72" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="306" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">filter</text>
  <text x="306" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">drops o1</text>

  <path d="M180 72 V40 H400" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M392 34 L402 40 L392 46" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <rect x="408" y="20" width="168" height="48" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="492" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">SQS search</text>
  <text x="492" y="58" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">copy of o1</text>

  <path d="M356 92 H400" stroke="#B33A1A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="408" y="88" width="168" height="48" rx="5" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="492" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">SQS count</text>
  <text x="492" y="126" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">no message</text>

  <rect x="408" y="152" width="168" height="40" rx="5" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="492" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">dashboard 0</text>

  <text x="360" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Fan-out with a filter is still a delete for one job.</text>
</svg>
