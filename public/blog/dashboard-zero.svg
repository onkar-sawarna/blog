<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img">
  <title>After one SQS steal, support can find order o1. The dashboard still says 0.</title>
  <rect width="720" height="240" fill="#F7F7F5"/>

  <rect x="36" y="28" width="300" height="148" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="186" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1A3D32">support search</text>
  <rect x="68" y="80" width="236" height="56" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.4"/>
  <text x="186" y="104" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#161616">query: o1</text>
  <text x="186" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">found</text>
  <text x="186" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">search deleted the message</text>

  <rect x="384" y="28" width="300" height="148" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="534" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#B33A1A">orders today</text>
  <text x="534" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#B33A1A">0</text>
  <text x="534" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">counter never saw o1</text>

  <text x="360" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Same checkout. One job ran. One did not.</text>
</svg>
