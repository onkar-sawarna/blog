<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>Pessimistic: lock 12A then write. Optimistic: both read empty, one update wins on version.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>
  <rect x="16" y="20" width="336" height="220" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="184" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1A3D32">pessimistic</text>
  <text x="184" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">A locks 12A</text>
  <text x="184" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">A writes booked</text>
  <text x="184" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">A unlocks</text>
  <text x="184" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">B waits, then sees booked</text>
  <text x="184" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">lock first</text>
  <rect x="368" y="20" width="336" height="220" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="536" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#B33A1A">optimistic</text>
  <text x="536" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">A and B both read empty</text>
  <text x="536" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">version is 3</text>
  <text x="536" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">A writes, version 4</text>
  <text x="536" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">B update hits 0 rows</text>
  <text x="536" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">no lock, check version</text>
  <text x="360" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Same seat. Lock before, or check after.</text>
</svg>
