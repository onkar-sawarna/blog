<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>A user hits the API. The API writes a database row, then publishes to a Kafka topic. Search and counter each poll that topic.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="20" y="118" width="72" height="40" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="56" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">user</text>
  <path d="M92 138 H120" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M112 132 L122 138 L112 144" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="124" y="110" width="88" height="56" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="168" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">API</text>
  <text x="168" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">checkout</text>

  <path d="M168 110 V72" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M162 80 L168 70 L174 80" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <rect x="124" y="28" width="88" height="44" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="168" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1A3D32">database</text>
  <text x="168" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5C5C59">order row</text>

  <path d="M212 138 H256" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M248 132 L258 138 L248 144" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="234" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5C5C59">publish</text>

  <rect x="260" y="88" width="196" height="100" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="358" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">topic: orders</text>
  <rect x="276" y="118" width="164" height="16" rx="3" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1"/>
  <text x="358" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1A3D32">partition 0</text>
  <rect x="276" y="138" width="164" height="16" rx="3" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1"/>
  <text x="358" y="150" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1A3D32">partition 1</text>
  <rect x="276" y="158" width="164" height="16" rx="3" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1"/>
  <text x="358" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1A3D32">partition 2</text>

  <path d="M456 118 H500" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M492 112 L502 118 L492 124" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M456 158 H500" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M492 152 L502 158 L492 164" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="478" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5C5C59">poll</text>
  <text x="478" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5C5C59">poll</text>

  <rect x="508" y="88" width="192" height="48" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.8"/>
  <text x="604" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">search group</text>
  <text x="604" y="126" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">writes an index</text>

  <rect x="508" y="148" width="192" height="48" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.8"/>
  <text x="604" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">counter group</text>
  <text x="604" y="186" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">writes a count to the DB</text>

  <text x="360" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">The row is the fact. The topic is the news.</text>
  <text x="360" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C5C59">Two groups poll the same topic. Each has its own cursor.</text>
  <text x="360" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">The topic is sliced into partitions. That is the architecture.</text>
</svg>
