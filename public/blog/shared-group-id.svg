<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img">
  <title>Search and the counter use the same Kafka group id. They become one job. One of them steals o1.</title>
  <rect width="720" height="260" fill="#F7F7F5"/>

  <rect x="24" y="36" width="200" height="140" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="124" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">topic orders</text>
  <text x="124" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1A3D32">o1 sits once</text>
  <path d="M224 106 H268" stroke="#B33A1A" stroke-width="1.6"/>
  <path d="M260 100 L270 106 L260 112" fill="none" stroke="#B33A1A" stroke-width="1.6"/>

  <rect x="276" y="36" width="420" height="140" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="486" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">group id: search</text>
  <text x="486" y="84" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">copied into both services</text>
  <rect x="300" y="100" width="172" height="52" rx="5" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="386" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">search</text>
  <text x="386" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">got o1</text>
  <rect x="496" y="100" width="172" height="52" rx="5" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="582" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">counter</text>
  <text x="582" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">split away</text>

  <text x="360" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Same group id. Same steal as one SQS queue.</text>
  <text x="360" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">The dashboard stays 0. You thought you left queues.</text>
</svg>
