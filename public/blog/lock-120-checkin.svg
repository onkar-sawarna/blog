<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img">
  <title>120 passengers, next empty seat. No lock piles on 1A. FOR UPDATE queues. NOWAIT errors. SKIP LOCKED fills the plane.</title>
  <rect width="720" height="320" fill="#F7F7F5"/>
  <rect x="16" y="20" width="166" height="230" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="99" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">No lock</text>
  <text x="99" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">most hit 1A</text>
  <text x="99" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">a few land late</text>
  <text x="99" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#B33A1A">3 or 4 seats</text>
  <text x="99" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">those rows</text>
  <text x="99" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">overbooked</text>
  <rect x="190" y="20" width="166" height="230" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="273" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">FOR UPDATE</text>
  <text x="273" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">one holds 1A</text>
  <text x="273" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">119 wait</text>
  <text x="273" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">then 1B, then 1C</text>
  <text x="273" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">120 unique</text>
  <text x="273" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">one at a time</text>
  <rect x="364" y="20" width="166" height="230" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="447" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">NOWAIT</text>
  <text x="447" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">a few grab 1A-1D</text>
  <text x="447" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#B33A1A">the rest error</text>
  <text x="447" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">no skip</text>
  <text x="447" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">3 or 4 seats</text>
  <text x="447" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">error storm</text>
  <rect x="538" y="20" width="166" height="230" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="621" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">SKIP LOCKED</text>
  <text x="621" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">skip the busy</text>
  <text x="621" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#161616">row, take next</text>
  <text x="621" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1A3D32">120 seats at once</text>
  <text x="621" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">120 unique</text>
  <text x="621" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">parallel</text>
  <text x="360" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Next empty seat. 120 desks. Four answers.</text>
</svg>
