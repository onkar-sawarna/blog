<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img">
  <title>A holds 12A and wants 12B. B holds 12B and wants 12A. MySQL kills one. Postgres waits, then walks the wait-for graph.</title>
  <rect width="720" height="280" fill="#F7F7F5"/>
  <rect x="24" y="36" width="200" height="88" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="124" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">A holds 12A</text>
  <text x="124" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">wants 12B</text>
  <rect x="24" y="148" width="200" height="88" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="124" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">B holds 12B</text>
  <text x="124" y="208" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">wants 12A</text>
  <rect x="260" y="36" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">cycle</text>
  <text x="360" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#161616">A waits on B</text>
  <text x="360" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#161616">B waits on A</text>
  <text x="360" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">nobody can move</text>
  <rect x="496" y="36" width="200" height="88" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="596" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">MySQL</text>
  <text x="596" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">kills one now</text>
  <rect x="496" y="148" width="200" height="88" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="596" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Postgres</text>
  <text x="596" y="208" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">wait, then walk the graph</text>
  <text x="360" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">A cycle is a deadlock. Someone has to lose.</text>
</svg>
