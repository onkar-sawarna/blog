<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
  <title>A healthy volume of logs can still leave the useful question blank.</title>
  <rect width="720" height="260" fill="#F7F7F5"/>
  <rect x="36" y="28" width="300" height="168" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="186" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#B33A1A">looks like seeing</text>
  <text x="72" y="88" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">timeout</text>
  <text x="72" y="108" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">retry</text>
  <text x="72" y="128" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">accept</text>
  <text x="72" y="148" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">deny</text>
  <text x="72" y="168" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">process exited</text>
  <rect x="384" y="28" width="300" height="168" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="534" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1A3D32">is this getting worse</text>
  <rect x="424" y="112" width="220" height="44" rx="4" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.5"/>
  <text x="534" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">(blank)</text>
  <text x="360" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Same incident. One of these is a window.</text>
</svg>
