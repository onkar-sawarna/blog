<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>An encoder reads samay.mp4 and writes 720p.m3u8 plus numbered segment files.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="16" y="88" width="132" height="72" rx="6" fill="#FFFFFF" stroke="#161616" stroke-width="1.6"/>
  <text x="82" y="118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">samay.mp4</text>
  <text x="82" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">one recording</text>

  <path d="M148 124 H188" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M180 118 L190 124 L180 130" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="192" y="68" width="200" height="112" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="292" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">encoder</text>
  <text x="292" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#161616">hls_time 6</text>
  <text x="292" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#161616">playlist_type vod</text>
  <text x="292" y="164" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">start_number 0</text>

  <path d="M392 100 H440" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M432 94 L442 100 L432 106" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="444" y="36" width="260" height="72" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="574" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1A3D32">720p.m3u8</text>
  <text x="574" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C5C59">the playlist path</text>

  <path d="M392 148 H440" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M432 142 L442 148 L432 154" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="444" y="124" width="260" height="80" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="574" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#161616">720p/seg%d.ts</text>
  <text x="574" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">seg0.ts  seg1.ts  seg2.ts</text>
  <text x="574" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">the segment files</text>

  <text x="360" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">The last argument is the playlist. The slices get their own names.</text>
  <text x="360" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">vod writes ENDLIST. event keeps appending lines.</text>
</svg>
