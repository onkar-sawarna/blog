<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img">
  <title>Hedging sends a second GET if the first is slow. Both check out of the same pool. One user used two connections.</title>
  <rect width="720" height="280" fill="#F7F7F5"/>

  <rect x="24" y="40" width="88" height="48" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="68" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">user</text>

  <path d="M112 64 H156" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M148 58 L158 64 L148 70" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="160" y="28" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="260" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">API, hedge at 50ms</text>
  <rect x="180" y="76" width="160" height="56" rx="5" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="260" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">GET 42, first</text>
  <text x="260" y="118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">still running</text>
  <rect x="180" y="148" width="160" height="56" rx="5" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="260" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#B33A1A">GET 42, second</text>
  <text x="260" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">launched at 50ms</text>

  <path d="M360 104 H408" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M400 98 L410 104 L400 110" fill="none" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M360 176 H408" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M400 170 L410 176 L400 182" fill="none" stroke="#B33A1A" stroke-width="1.5"/>

  <rect x="412" y="28" width="284" height="200" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="554" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">same pool</text>
  <rect x="436" y="76" width="236" height="56" rx="5" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="554" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">c1 checked out by first</text>
  <rect x="436" y="148" width="236" height="56" rx="5" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="554" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">c2 checked out by hedge</text>

  <text x="360" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">One page view. Two checkouts. The slow one did not cancel the load.</text>
</svg>
