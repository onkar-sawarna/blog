<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>ProxySQL reads the query text. SELECT item 42 goes to a replica. INSERT of an order goes to the primary.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="20" y="108" width="88" height="52" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="64" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">API</text>

  <path d="M108 134 H156" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M148 128 L158 134 L148 140" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="160" y="88" width="168" height="92" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="244" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">ProxySQL</text>
  <text x="244" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">looks at the SQL</text>

  <path d="M244 88 V56 H500" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M492 50 L502 56 L492 62" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="360" y="48" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">SELECT item 42</text>

  <path d="M244 180 V220 H500" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M492 214 L502 220 L492 226" fill="none" stroke="#B33A1A" stroke-width="1.5"/>
  <text x="360" y="244" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">INSERT order o1</text>

  <rect x="508" y="28" width="192" height="64" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="604" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">replica</text>
  <text x="604" y="78" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">reads</text>

  <rect x="508" y="188" width="192" height="64" rx="6" fill="#FFFFFF" stroke="#B33A1A" stroke-width="1.6"/>
  <text x="604" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">primary</text>
  <text x="604" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#B33A1A">writes</text>

  <text x="360" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">A TCP load balancer cannot make this split. It never sees the query.</text>
</svg>
