<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img">
  <title>A routing rule change on one ProxySQL does not reach the others. They do not gossip. You apply the same change on every copy.</title>
  <rect width="720" height="260" fill="#F7F7F5"/>

  <rect x="24" y="28" width="208" height="152" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="128" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">ProxySQL a</text>
  <text x="128" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">new rule</text>
  <text x="128" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">SELECT to primary</text>
  <text x="128" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C5C59">you changed this one</text>

  <rect x="256" y="28" width="208" height="152" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="360" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">ProxySQL b</text>
  <text x="360" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">old rule</text>
  <text x="360" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">SELECT to replica</text>
  <text x="360" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#B33A1A">never heard</text>

  <rect x="488" y="28" width="208" height="152" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="592" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">ProxySQL c</text>
  <text x="592" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#161616">old rule</text>
  <text x="592" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">SELECT to replica</text>
  <text x="592" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#B33A1A">never heard</text>

  <text x="360" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">They do not tell each other. A rule change is a change on every box.</text>
</svg>
