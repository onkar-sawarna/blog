<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>The API hashes the key onto a partition. Each consumer group assigns every partition to one of its members. Both groups see every event.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">API hashes the key. The broker does not pick for you.</text>

  <rect x="24" y="48" width="200" height="88" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.8"/>
  <text x="124" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">key = user_id</text>
  <text x="124" y="100" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1A3D32">hash(u1) % 3 = 0</text>
  <text x="124" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1A3D32">hash(u2) % 3 = 2</text>

  <path d="M224 92 H268" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M260 86 L270 92 L260 98" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="276" y="44" width="168" height="28" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="360" y="63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">p0  u1 order</text>
  <rect x="276" y="78" width="168" height="28" rx="4" fill="#FFFFFF" stroke="#C5D4CB" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="360" y="97" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">p1  (empty here)</text>
  <rect x="276" y="112" width="168" height="28" rx="4" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="360" y="131" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1A3D32">p2  u2 order</text>

  <rect x="480" y="40" width="216" height="56" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.8"/>
  <text x="588" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">search group</text>
  <text x="588" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">s0:p0   s1:p1   s2:p2</text>

  <rect x="480" y="108" width="216" height="56" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.8"/>
  <text x="588" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">counter group</text>
  <text x="588" y="150" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">c0:p0   c1:p1   c2:p2</text>

  <path d="M444 58 H480" stroke="#1A3D32" stroke-width="1.3"/>
  <path d="M444 126 H480" stroke="#1A3D32" stroke-width="1.3"/>

  <text x="360" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">u1 lands on p0. Search s0 reads it. Counter c0 also reads it.</text>
  <text x="360" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C5C59">Same event, two jobs. Each group covers all three partitions.</text>
  <text x="360" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C5C59">s0 does not hand the event to c0. They never share a cursor.</text>
  <text x="360" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">A fourth search process has no partition left.</text>
</svg>
