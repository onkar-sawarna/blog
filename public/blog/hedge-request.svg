<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img">
  <title>A user asks for item 42. The API checks the cache, then the database, then returns the page.</title>
  <rect width="720" height="280" fill="#F7F7F5"/>

  <rect x="20" y="100" width="72" height="44" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="56" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">user</text>
  <path d="M92 122 H124" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M116 116 L126 122 L116 128" fill="none" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="108" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5C5C59">GET /item/42</text>

  <rect x="128" y="92" width="80" height="60" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="168" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">API</text>
  <text x="168" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">one request</text>

  <path d="M208 122 H248" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M240 116 L250 122 L240 128" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="252" y="92" width="100" height="60" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="302" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">cache</text>
  <text x="302" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">miss on 42</text>

  <path d="M352 122 H392" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M384 116 L394 122 L384 128" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="396" y="92" width="120" height="60" rx="6" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="456" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1A3D32">pool</text>
  <text x="456" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">checkout one</text>

  <path d="M516 122 H556" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M548 116 L558 122 L548 128" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="560" y="92" width="136" height="60" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="628" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">database</text>
  <text x="628" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">row for 42</text>

  <text x="360" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">One read. Cache first. Then one checkout from the pool.</text>
  <text x="360" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">The page is not allowed to open its own database socket.</text>
</svg>
