<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>Three lanes, three readers. The fourth process has nothing to poll.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="36" y="40" width="240" height="36" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <rect x="48" y="48" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#1A3D32"/>
  <rect x="74" y="48" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#1A3D32"/>
  <path d="M276 58 H330" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M322 52 L332 58 L322 64" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <rect x="338" y="36" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="388" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">c1</text>

  <rect x="36" y="108" width="240" height="36" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <rect x="48" y="116" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#1A3D32"/>
  <path d="M276 126 H330" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M322 120 L332 126 L322 132" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <rect x="338" y="104" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="388" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">c2</text>

  <rect x="36" y="176" width="240" height="36" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <rect x="48" y="184" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#1A3D32"/>
  <rect x="74" y="184" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#1A3D32"/>
  <rect x="100" y="184" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#1A3D32"/>
  <path d="M276 194 H330" stroke="#1A3D32" stroke-width="1.6"/>
  <path d="M322 188 L332 194 L322 200" fill="none" stroke="#1A3D32" stroke-width="1.6"/>
  <rect x="338" y="172" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="388" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">c3</text>

  <rect x="500" y="84" width="184" height="108" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="592" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#B33A1A">c4</text>
  <text x="592" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">polls nothing</text>
  <text x="592" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">no lane left</text>

  <text x="360" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">You added a consumer. Kafka did not add a lane.</text>
  <text x="360" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C5C59">The fourth process is not broken. It is unemployed.</text>
</svg>
