<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>Many users ask for item 42. Redis has no key. Every API worker goes to the database through the pool.</title>
  <rect width="720" height="300" fill="#F7F7F5"/>

  <rect x="16" y="40" width="100" height="168" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.6"/>
  <text x="66" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">users</text>
  <text x="66" y="104" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">GET 42</text>
  <text x="66" y="126" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">GET 42</text>
  <text x="66" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">GET 42</text>
  <text x="66" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5C5C59">GET 42</text>
  <text x="66" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C5C59">same item</text>

  <path d="M116 124 H156" stroke="#1A3D32" stroke-width="1.5"/>
  <path d="M148 118 L158 124 L148 130" fill="none" stroke="#1A3D32" stroke-width="1.5"/>

  <rect x="160" y="72" width="88" height="104" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="204" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">API</text>
  <text x="204" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">one process</text>

  <path d="M248 124 H288" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M280 118 L290 124 L280 130" fill="none" stroke="#B33A1A" stroke-width="1.5"/>

  <rect x="292" y="56" width="148" height="136" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="366" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#B33A1A">Redis</text>
  <text x="366" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">GET item:42</text>
  <text x="366" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#B33A1A">(nil)</text>
  <text x="366" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#B33A1A">no entry</text>

  <path d="M440 124 H480" stroke="#B33A1A" stroke-width="1.5"/>
  <path d="M472 118 L482 124 L472 130" fill="none" stroke="#B33A1A" stroke-width="1.5"/>

  <rect x="484" y="56" width="220" height="136" rx="8" fill="#FFFFFF" stroke="#B33A1A" stroke-width="2"/>
  <text x="594" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#B33A1A">pool, then database</text>
  <text x="594" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">same row, many times</text>
  <text x="594" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#B33A1A">checkouts pile up</text>
  <text x="594" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#B33A1A">pages get slow</text>

  <text x="360" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#161616">Redis had nothing. Every GET became a database read.</text>
  <text x="360" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">The pool saved the handshake. It did not save the query.</text>
</svg>
