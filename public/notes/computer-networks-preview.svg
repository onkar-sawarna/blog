<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img">
  <rect width="960" height="420" fill="#F7F7F5"/>
  <rect x="28" y="24" width="904" height="372" rx="10" fill="#FFFFFF" stroke="#E0E0DC"/>

  <text x="56" y="58" font-family="Georgia, serif" font-size="13" fill="#1A3D32">Figure 1</text>
  <text x="56" y="84" font-family="Georgia, serif" font-size="22" fill="#161616">A process on one box wants a process on another box to see some bytes.</text>

  <rect x="64" y="118" width="250" height="168" rx="8" fill="#FFFFFF" stroke="#1A3D32" stroke-width="2"/>
  <text x="189" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1A3D32">your laptop</text>
  <text x="189" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">a process</text>
  <text x="189" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">the client</text>
  <text x="189" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">127.0.0.1 is only you</text>

  <line x1="330" y1="202" x2="618" y2="202" stroke="#1A3D32" stroke-width="2"/>
  <polygon points="618,202 600,193 600,211" fill="#1A3D32"/>
  <circle cx="400" cy="202" r="5" fill="#1A3D32"/>
  <circle cx="474" cy="202" r="5" fill="#2A6B52"/>
  <circle cx="548" cy="202" r="5" fill="#1A3D32"/>
  <text x="474" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">packets</text>
  <text x="474" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1A3D32">to IP : port</text>

  <rect x="646" y="118" width="250" height="168" rx="8" fill="#E8EFEA" stroke="#1A3D32" stroke-width="2"/>
  <text x="771" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1A3D32">another machine</text>
  <text x="771" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">a process</text>
  <text x="771" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#5C5C59">the server</text>
  <text x="771" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">the door is the port</text>

  <rect x="64" y="314" width="200" height="54" rx="6" fill="#E8EFEA" stroke="#1A3D32"/>
  <text x="164" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">address</text>
  <text x="164" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">which machine</text>
  <rect x="276" y="314" width="200" height="54" rx="6" fill="#F7F7F5" stroke="#C5D4CB"/>
  <text x="376" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">door</text>
  <text x="376" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">which process</text>
  <rect x="488" y="314" width="200" height="54" rx="6" fill="#F7F7F5" stroke="#C5D4CB"/>
  <text x="588" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">path</text>
  <text x="588" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">what sits between</text>
  <rect x="700" y="314" width="196" height="54" rx="6" fill="#F7F7F5" stroke="#C5D4CB"/>
  <text x="798" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1A3D32">conversation</text>
  <text x="798" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C59">TCP or a throw</text>
</svg>
