<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img">
  <title>Ten steps I run on every system on a board.</title>
  <rect width="720" height="340" fill="#F7F7F5"/>

  <rect x="16" y="16" width="132" height="56" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="82" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">1</text>
  <text x="82" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Scope</text>

  <rect x="156" y="16" width="132" height="56" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="222" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">2</text>
  <text x="222" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">API</text>

  <rect x="296" y="16" width="132" height="56" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="362" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">3</text>
  <text x="362" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Data</text>

  <rect x="436" y="16" width="132" height="56" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="502" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">4</text>
  <text x="502" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Classes</text>

  <rect x="576" y="16" width="128" height="56" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="640" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">5</text>
  <text x="640" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Patterns</text>

  <rect x="16" y="88" width="132" height="56" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="82" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">6</text>
  <text x="82" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Sequence</text>

  <rect x="156" y="88" width="132" height="56" rx="5" fill="#E8EFEA" stroke="#1A3D32" stroke-width="1.5"/>
  <text x="222" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">7</text>
  <text x="222" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Concurrency</text>

  <rect x="296" y="88" width="132" height="56" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="362" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">8</text>
  <text x="362" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Edges</text>

  <rect x="436" y="88" width="132" height="56" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="502" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">9</text>
  <text x="502" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">C++</text>

  <rect x="576" y="88" width="128" height="56" rx="5" fill="#FFFFFF" stroke="#1A3D32" stroke-width="1.3"/>
  <text x="640" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1A3D32">10</text>
  <text x="640" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#161616">Extend</text>

  <text x="360" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#161616">Steps 1 to 4 are the seven-step walk, written for a board.</text>
  <text x="360" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">5 is a name only if two ways exist. 6 and 7 are the pictures.</text>
  <text x="360" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C5C59">8 is every fail on the API. 9 is the skeleton. 10 is out.</text>
  <text x="360" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#161616">On scope I also write: types, multiplicity, pick logic, races.</text>
  <text x="360" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C5C59">Creational / structural / behavioural is how I sort the names in 5.</text>
  <text x="360" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C5C59">I do not start at 5. I do not skip 7.</text>
</svg>
